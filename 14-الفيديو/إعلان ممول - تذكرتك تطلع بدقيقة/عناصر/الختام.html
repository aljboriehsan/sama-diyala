<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="_fonts.css">
<style>
/* Animated end card (5 s), rendered frame by frame: window.seek(t) sets every animation to t seconds.
   Text stays between y≈330 and y≈1245: below the Reels header, above the caption/CTA area (bottom 35%),
   and inside the 4:5 feed crop. */
:root{--lock-dx:-1.9px; --name-dy:4px; --tag-size:23px; --tag-ws:0.72px; --tag-dx:0.4px;}
*{margin:0;padding:0;box-sizing:border-box} html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
.brand{display:inline-flex;flex-direction:column;align-items:stretch}
.lockup{display:flex;align-items:center;justify-content:center;gap:18px;transform:translateX(var(--lock-dx))}
.lockup img{height:84px;display:block}
.lockup .name{font-family:Tajawal;font-weight:700;font-size:64px;line-height:1;padding-bottom:8px;white-space:nowrap;transform:translateY(var(--name-dy))}
.tag{margin:10px auto 0;width:max-content;font-family:TajawalT;font-weight:500;font-size:var(--tag-size);line-height:1.2;
     white-space:nowrap;text-align:center;word-spacing:var(--tag-ws)}

.bg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,40,24,.40) 0%,rgba(10,55,32,.74) 22%,rgba(10,55,32,.80) 66%,rgba(8,40,24,.55) 100%)}
.c{position:absolute;left:0;right:0;top:332px;display:flex;flex-direction:column;align-items:center;color:#fff;text-align:center;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.c .bw{transform:scale(1.32);transform-origin:50% 0;height:232px}
.l{font-family:TajawalT;font-weight:700;font-size:48px;line-height:1.32}
.l b{color:#C9A44C;font-weight:700}
.dv{margin:30px 0 26px;width:120px;height:3px;background:#C9A44C;border-radius:2px}
.cta{font-family:Tajawal;font-weight:700;font-size:62px;line-height:1.15;color:#C9A44C}
.sub{margin-top:10px;font-family:TajawalT;font-weight:500;font-size:38px;line-height:1.3}
.wa{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;direction:ltr;background:#C9A44C;color:#0E4D2C;border-radius:999px;padding:14px 46px 16px;text-shadow:none;width:520px;
  font-family:TajawalT;font-weight:700;font-size:46px;letter-spacing:1px;word-spacing:-5px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.wa svg{width:44px;height:44px}
.wb{margin-top:28px}
.pb{margin-top:16px}
.ph{display:flex;align-items:center;justify-content:center;gap:16px;direction:ltr;border:3px solid #fff;color:#fff;border-radius:999px;padding:11px 46px 13px;width:520px;
  font-family:TajawalT;font-weight:700;font-size:46px;letter-spacing:1px;word-spacing:-5px;background:rgba(14,77,44,.35)}
.ph svg{width:42px;height:42px}
.ring{position:absolute;inset:0;border-radius:999px;border:4px solid #C9A44C}
.ad2{margin-top:20px;display:flex;align-items:center;gap:10px;font-family:TajawalT;font-weight:500;font-size:32px;opacity:.9}
.ad2 svg{width:34px;height:34px;flex:none}

/* timeline */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.86)}70%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes ring{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.18,1.5)}}
.bg  {animation:fade .45s ease-out 0s both}
.bw  {animation:fade .5s ease-out .15s both}
.l   {animation:rise .55s ease-out .35s both}
.dv  {animation:grow .45s ease-out 1.05s both}
.cta {animation:rise .5s ease-out 1.15s both}
.sub {animation:rise .5s ease-out 1.35s both}
.wb  {animation:pop .5s ease-out 1.6s both}
.wa  {animation:pulse 1.2s ease-in-out 2.4s 3 both}
.ring{animation:ring 1.2s ease-out 2.4s 3 both}
.pb  {animation:pop .5s ease-out 1.8s both}
.ad2 {animation:fade .5s ease-out 2.05s both}
</style></head><body><div class="bg"></div><div class="c">
<div class="bw"><div class="brand" id="brand"><div class="lockup" id="lockup"><img src="../../../01-الشعار/أحادي بلا الاسم الصغير/الرمز - أبيض.svg" alt=""><div class="name">سماء ديالى</div></div>
<div class="tag" id="tag">الوكيــــــل العــــــام للخطــــــوط الجويــــــة العراقيـــــة</div></div></div>
<div class="l">تذكرتك من <b>الوكيل العام</b><br>للخطوط الجوية العراقية<br>في محافظة ديالى</div>
<div class="dv"></div>
<div class="cta">احجز الآن عبر الواتساب أو الاتصال</div>
<div class="sub">من أي محافظة، وتذكرتك توصلك على موبايلك</div>
<div class="wb"><div class="wa"><div class="ring"></div><svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.5-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.6.3-.8.3-1.4.2-1.6-.1-.1-.3-.2-.6-.3z"/></svg><span>0774 1777 500</span></div></div>
<div class="pb"><div class="ph"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.5-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.6.3-.8.3-1.4.2-1.6-.1-.1-.3-.2-.6-.3z"/></svg><span>077 0756 4440</span></div></div>
<div class="ad2"><svg viewBox="0 0 24 24" fill="#C9A44C"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span>بعقوبة – قرب كراج البحيرة</span></div>
</div>
<script>
window.seek=t=>{document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000})};
document.fonts.ready.then(()=>{
  // stretch the agent line's word-spacing to the logo+name ink width (as in the ads)
  const t=document.getElementById('tag'),l=document.getElementById('lockup');let ws=0;
  for(let i=0;i<60;i++){const d=l.getBoundingClientRect().width-t.getBoundingClientRect().width;if(Math.abs(d)<0.5)break;ws+=d/5*0.9;t.style.wordSpacing=ws+'px';}
  document.body.dataset.ready='1'});
</script></body></html>
