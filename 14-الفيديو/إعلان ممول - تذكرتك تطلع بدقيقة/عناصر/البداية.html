<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="_fonts.css">
<style>
/* Animated hook over the keyboard shot (0–3 s): line 1 is there from the first frame,
   line 2 slides in under it at 1.2 s, both fade out at the cut. Rendered with window.seek(t). */
*{margin:0;padding:0;box-sizing:border-box} html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
/* top:360 keeps the hook below the Reels header and inside the 4:5 feed crop */
.h{position:absolute;left:0;right:0;top:360px;display:flex;flex-direction:column;align-items:center;gap:18px}
.h span{font-family:Tajawal;font-weight:700;line-height:1.2;color:#fff;background:rgba(14,77,44,.84);border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.h .a{font-size:96px;padding:18px 50px 22px}
.h .b{font-size:78px;padding:14px 44px 18px}
.h i{font-style:normal;color:#C9A44C}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes out{from{opacity:1}to{opacity:0}}
.h  {animation:out .25s linear 2.75s both}
.h .b{animation:rise .4s ease-out 1.2s both}
</style></head><body><div class="h"><span class="a">تذكرتك تطلع <i>بدقيقة</i></span><span class="b">وتوصلك <i>لمكانك</i></span></div>
<script>window.seek=t=>{document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000})};
document.fonts.ready.then(()=>{document.body.dataset.ready='1'})</script></body></html>
