html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.cap{position:absolute;left:0;right:0;bottom:430px;display:flex;justify-content:center}
.cap span{font-family:TajawalT;font-weight:500;font-size:43px;line-height:1.35;color:#fff;padding:10px 30px 13px;border-radius:14px;background:rgba(0,0,0,.48);display:flex;align-items:center;gap:14px}
.cap span:before{content:"";width:12px;height:12px;border-radius:50%;background:#C9A44C;flex:none}
.tag{margin-top:10px !important}
</style></head><body><div class="cap"><span>__T__</span></div>
<script>
// stretch the agent line to the exact width of logo + name (Tajawal widths differ from the old measured setup)
document.fonts.ready.then(()=>{const t=document.getElementById('tag'),l=document.getElementById('lockup');
 if(t&&l){t.style.transform='none';let ws=0;for(let i=0;i<60;i++){const d=l.getBoundingClientRect().width-t.getBoundingClientRect().width;if(Math.abs(d)<0.5)break;ws+=d/5*0.9;t.style.wordSpacing=ws+'px';}}
 document.body.dataset.ready='1'});
</script></body></html>
