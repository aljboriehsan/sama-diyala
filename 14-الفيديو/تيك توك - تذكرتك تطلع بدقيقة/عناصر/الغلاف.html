:root{--lock-dx:-1.9px; --name-dy:22px; --tag-size:20px; --tag-ws:0.72px; --tag-dx:0.4px;}
*{margin:0;padding:0;box-sizing:border-box} html,body{width:1080px;height:1920px;background:#0E4D2C;overflow:hidden}
  .brand{display:inline-flex;flex-direction:column;align-items:stretch}
  .lockup{display:flex;align-items:center;justify-content:center;gap:18px}
  .lockup img{height:84px;display:block}
  .lockup{transform:translateX(var(--lock-dx))}
  .lockup .name{font-family:Naskh;font-weight:700;font-size:54px;line-height:1;padding-bottom:8px;white-space:nowrap;
                transform:translateY(var(--name-dy))}
  .tag{margin:12px auto 0;width:max-content;font-family:Plex;font-weight:500;font-size:var(--tag-size);line-height:1.2;
       white-space:nowrap;text-align:center;opacity:.92;word-spacing:var(--tag-ws);transform:translateX(var(--tag-dx))}
.tag{opacity:1}


.bg{position:absolute;inset:0;background:url("إطار الغلاف.png") center/cover}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,40,24,.55) 0%,rgba(8,40,24,.15) 30%,rgba(8,40,24,.10) 55%,rgba(8,40,24,.55) 100%)}
.top{position:absolute;left:0;right:0;top:330px;display:flex;justify-content:center;color:#fff}
.top .brand{transform:scale(1.35);transform-origin:50% 0}
.h{position:absolute;left:0;right:0;top:640px;display:flex;flex-direction:column;align-items:center;gap:22px}
.h span{font-family:Naskh;font-weight:700;font-size:104px;line-height:1.15;color:#fff;background:rgba(14,77,44,.88);padding:16px 50px 26px;border-radius:30px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.h span i{font-style:normal;color:#C9A44C}
.h small{font-family:Plex;font-weight:600;font-size:36px;color:#0E4D2C;background:#C9A44C;border-radius:999px;padding:8px 30px 12px}

<div class="top"><div class="brand" id="brand"><div class="lockup" id="lockup"><img src="../../../01-الشعار/أحادي بلا الاسم الصغير/الرمز - أبيض.svg" alt=""><div class="name">سماء ديالى</div></div>
<div class="tag" id="tag">الوكيــــــل العــــــام للخطــــــوط الجويــــــة العراقيـــــة</div></div></div>
