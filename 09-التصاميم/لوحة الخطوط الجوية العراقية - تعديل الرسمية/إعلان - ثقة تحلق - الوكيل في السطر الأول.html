  @font-face{font-family:TajawalT;font-weight:700;src:url("../../07-أدوات/خطوط/tajawal-latin-800-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}
/* The airline's official billboard kept as it is; only an address + numbers panel added in the free strip
   between the Iraqi Airways logo and the 5511 badge, under the landing gear (asked by Ihsan). */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:685px;overflow:hidden}
.ad{position:relative;width:1600px;height:685px;background:url("أساس - ثقة تحلق.png") 0 0/1600px 685px no-repeat}
.pn{position:absolute;left:288px;width:980px;top:570px;height:111px;border-radius:18px;background:rgba(6,34,20,.74);
    border:2px solid rgba(201,164,76,.85);display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 16px;direction:rtl;color:#fff;
    backdrop-filter:blur(4px)}
.addr{display:flex;align-items:center;gap:12px}
.addr svg{width:40px;height:40px;flex:none}
.addr .l{width:max-content;white-space:nowrap;font-family:TajawalT;font-weight:700;line-height:1.2}
.addr .l1{font-size:25px;color:#C9A44C}
.addr .l2{font-size:24px}
.addr .l3{font-size:24px;font-weight:600;display:flex;align-items:center;gap:6px}
.addr .l3 svg.pin{width:24px;height:24px;flex:none}
.vs{width:2px;height:84px;margin:0 8px;background:rgba(201,164,76,.6)}
.nums{display:flex;flex-direction:column;gap:6px}
.n{display:flex;align-items:center;gap:12px;direction:ltr;font-family:TajawalT;font-weight:700;font-size:35px;line-height:1.05;letter-spacing:.5px;word-spacing:-6px;white-space:nowrap}
.n .ic{width:42px;height:42px;border-radius:50%;background:#C9A44C;display:flex;align-items:center;justify-content:center;flex:none}
.n .ic svg{width:23px;height:23px}
.cs{position:absolute;left:1282px;top:452px;width:230px;height:139px;background:#fff;border-radius:14px;padding:4px;display:flex;flex-direction:column;box-shadow:0 3px 8px rgba(0,0,0,.28)}
.cs .k{height:44px;display:flex;align-items:center;justify-content:center;font-family:TajawalT;font-weight:700;font-size:28px;color:#0d5839}
.cs .v{flex:1;background:#0d5839;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:Tajawal;font-weight:700;font-size:76px;line-height:1;color:#fff;letter-spacing:1px}
.tg{position:absolute;left:92px;width:800px;top:178px;text-align:center;font-family:TajawalT;font-weight:500;font-size:52px;line-height:1.2;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.lic{position:absolute;left:1293px;top:606px;width:208px;height:66px;background:#C9A44C;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
     font-family:TajawalT;font-weight:700;color:#0E4D2C;line-height:1.18;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.28)}
.lic .l1{font-size:19px}.lic .l2{font-size:21px;white-space:nowrap}
</style></head><body><div class="ad">
<div class="cs"><div class="k">خدمة الزبائن</div><div class="v">5511</div></div>
<div class="lic"><div class="l1">الإعلان مجاز من قبل</div><div class="l2">بلدية بعقوبة</div></div>
<div class="tg">ثقةٌ تُحلّق، وخدمةٌ تليق بكم.</div>
<div class="pn">
  <div class="addr">
    <div><div class="l l1">الوكيل العام للخطوط الجوية العراقية في محافظة ديالى</div><div class="l l2">شركة سماء ديالى</div><div class="l l3"><svg class="pin" viewBox="0 0 24 24" fill="#C9A44C"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span>بعقوبة – قرب كراج البحيرة</span></div></div></div>
  <div class="vs"></div>
  <div class="nums">
    <div class="n"><span class="ic"><svg viewBox="0 0 32 32" fill="#0E4D2C"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.5-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.6.3-.8.3-1.4.2-1.6-.1-.1-.3-.2-.6-.3z"/></svg></span>077 0006 9900</div>
    <div class="n"><span class="ic"><svg viewBox="0 0 24 24" fill="#0E4D2C"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span>077 0756 4440</div>
  </div>
</div>
</div>
<script>document.fonts.ready.then(()=>{
  // shrink any address line that would push the panel past its width (keeps one line each)
  const pn=document.querySelector('.pn'),nums=document.querySelector('.nums'),vs=document.querySelector('.vs');
  const max=pn.clientWidth-36-nums.getBoundingClientRect().width-vs.getBoundingClientRect().width-16-6;
  document.querySelectorAll('.addr .l').forEach(l=>{let f=parseFloat(getComputedStyle(l).fontSize);
    while(l.scrollWidth>max&&f>14){f-=0.25;l.style.fontSize=f+'px';} l.dataset.fs=f;});
  document.body.dataset.ready='1'})</script></body></html>
