*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0E4D2C}

.head{position:absolute;top:44px;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:5}
.mist{position:absolute;width:380px;height:150px;transform-origin:0 0;filter:blur(14px)}

.win img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.win::after{content:"";position:absolute;inset:0;border-radius:230px;box-shadow:inset 0 0 40px rgba(14,77,44,.35)}
.plane{position:absolute;left:150px;top:346px;width:780px;z-index:3;filter:drop-shadow(0 22px 26px rgba(0,0,0,.28))}
.over{z-index:4}
.rows{position:absolute;left:0;right:0;top:858px;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5}
.kick{font-family:Tajawal;font-weight:700;font-size:62px;line-height:1.15;color:var(--gold);margin-bottom:0}
.row{display:flex;align-items:stretch;gap:10px;direction:ltr}
.box{direction:rtl;background:#fff;color:var(--green);border-radius:14px;padding:0 30px;height:68px;display:flex;align-items:center;
  font-family:TajawalT;font-weight:600;font-size:39px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sq{width:68px;height:68px;border-radius:14px;background:var(--mid);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sq svg{width:38px;height:38px}
.row.big .box{height:84px;background:var(--gold);font-size:44px;gap:16px}
.row.big .box b{font-weight:600;font-size:67px;direction:ltr;letter-spacing:1px}
.row.big .sq{height:84px;width:84px;background:#E9F2EA}
.contacts{position:absolute;left:96px;right:96px;bottom:66px;display:flex;gap:22px;z-index:5}
.ct{flex:1;height:66px;border:1.5px solid rgba(233,242,234,.55);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:14px;
  font-family:TajawalT;font-weight:500;font-size:31px;color:#fff;direction:ltr;background:rgba(255,255,255,.04)}
.ct svg{width:30px;height:30px;color:var(--gold);flex:none}
.ct.ph span{word-spacing:-4px;letter-spacing:1px;font-weight:600;font-size:34px}
.stripes{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:7px}
.stripes i{display:block;width:44px;height:6px;transform:skewX(-35deg);border-radius:1px}
.stripes i:nth-child(1){background:var(--gold)} .stripes i:nth-child(2){background:var(--mid)}
.tag{margin-top:10px !important}
.ct span{padding-top:7px}

<script>
// stretch the agent line to the exact width of logo + name (Tajawal widths differ from the old measured setup)
document.fonts.ready.then(()=>{const t=document.getElementById('tag'),l=document.getElementById('lockup');
 if(t&&l){t.style.transform='none';let ws=0;for(let i=0;i<60;i++){const d=l.getBoundingClientRect().width-t.getBoundingClientRect().width;if(Math.abs(d)<0.5)break;ws+=d/5*0.9;t.style.wordSpacing=ws+'px';}}
