:root{--green:#0E4D2C;--mid:#2F7A41;--gold:#C9A44C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:600px;overflow:hidden;background:#0E4D2C}
.s{position:relative;width:1600px;height:600px;overflow:hidden;color:#fff;
   background:radial-gradient(70% 120% at 20% 50%,#17633b 0%,#0E4D2C 55%,#0a3d22 100%)}
.top{position:absolute;left:0;right:0;top:0;height:10px;background:var(--gold)}
.top2{position:absolute;left:0;right:0;top:10px;height:8px;background:var(--mid)}

.st.g{bottom:6px;height:7px;background:var(--gold)}

.lg{position:absolute;right:50px;top:18px;bottom:0;width:340px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lg img{width:230px;display:block}
.lg .nm{margin-top:14px;font-family:Tajawal;font-weight:700;font-size:72px;line-height:1;white-space:nowrap}
.dv{position:absolute;right:430px;top:70px;bottom:52px;width:4px;background:var(--gold);border-radius:2px;opacity:.85}

.t1{font-family:Tajawal;font-weight:700;font-size:62px;line-height:1.08;white-space:nowrap}

.wa{margin-top:30px;display:flex;align-items:center;gap:22px;direction:ltr}
.wa .ic{width:112px;height:112px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.wa .ic svg{width:66px;height:66px}
.wa .n{font-family:Tajawal;font-weight:700;font-size:122px;line-height:1;letter-spacing:2px;word-spacing:-18px;white-space:nowrap}
.ph{margin-top:14px;display:flex;align-items:center;gap:16px;direction:ltr}
.ph .ic{width:64px;height:64px;border-radius:50%;border:4px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.ph .ic svg{width:34px;height:34px}
.ph .ic svg path{fill:var(--gold)}
.ph .n{font-family:Tajawal;font-weight:700;font-size:66px;line-height:1;letter-spacing:1px;word-spacing:-10px;white-space:nowrap}
.ad{margin-top:18px;display:flex;align-items:center;gap:10px;font-family:TajawalT;font-weight:700;font-size:38px;white-space:nowrap}
.ad svg{width:40px;height:40px;flex:none}
.lic{position:absolute;left:28px;bottom:26px;background:var(--gold);color:var(--green);border-radius:12px;padding:8px 18px 10px;

</div>

</div>
