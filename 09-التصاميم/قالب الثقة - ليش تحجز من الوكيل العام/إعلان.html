<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ليش تحجز من الوكيل العام</title>
<style>
  @font-face{font-family:Naskh;font-weight:700;src:url("../../07-أدوات/خطوط/noto-naskh-arabic-arabic-700-normal.woff2")}
  @font-face{font-family:Plex;font-weight:400;src:url("../../07-أدوات/خطوط/ibm-plex-sans-arabic-arabic-400-normal.woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
  @font-face{font-family:Plex;font-weight:400;src:url("../../07-أدوات/خطوط/ibm-plex-sans-arabic-latin-400-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:Plex;font-weight:500;src:url("../../07-أدوات/خطوط/ibm-plex-sans-arabic-arabic-500-normal.woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
  @font-face{font-family:Plex;font-weight:500;src:url("../../07-أدوات/خطوط/ibm-plex-sans-arabic-latin-500-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:Plex;font-weight:600;src:url("../../07-أدوات/خطوط/ibm-plex-sans-arabic-arabic-600-normal.woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
  @font-face{font-family:Plex;font-weight:600;src:url("../../07-أدوات/خطوط/ibm-plex-sans-arabic-latin-600-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}

  :root{
    --green:#0E4D2C; --mid:#2F7A41; --gold:#C9A44C; --light:#E9F2EA; --white:#FFFFFF;
    --ink:#FFFFFF;          /* single logo/text colour, chosen per background */
    --accent:var(--gold);   /* price colour */
    --img-y:-150px;
    --lock-dx:-1.9px; --name-dy:22px; --tag-size:20px; --tag-ws:0.72px; --tag-dx:0.4px;   /* header fine-tuning */
    /* --img-y: vertical position of the photo (1080 x 1620 after scaling) */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#0E4D2C}
  .ad{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--ink)}
  .photo{position:absolute;left:0;top:0;width:1080px;height:1004px;background:url("../../08-الصور/وجهات/إسطنبول رأس السنة - كولاج (أجزاء)/sky.jpg") 0 0/1080px 1004px no-repeat}
  .shade-top{position:absolute;inset:0 0 auto 0;height:640px;
             background:linear-gradient(180deg,rgba(6,24,44,.50) 0%,rgba(6,24,44,.38) 60%,rgba(6,24,44,.10) 100%)}
  .collage{position:absolute;inset:0;display:block}
  .shade-bot{position:absolute;inset:auto 0 0 0;height:520px;
             background:linear-gradient(0deg,rgba(4,10,26,.78) 0%,rgba(4,10,26,.35) 55%,rgba(4,10,26,0) 100%)}

  /* ---- header ---- */
  .head{position:absolute;top:58px;left:0;right:0;display:flex;flex-direction:column;align-items:center}
  .brand{display:inline-flex;flex-direction:column;align-items:stretch}
  .lockup{display:flex;align-items:center;justify-content:center;gap:18px}
  .lockup img{height:84px;display:block}
  .lockup{transform:translateX(var(--lock-dx))}
  .lockup .name{font-family:Naskh;font-weight:700;font-size:54px;line-height:1;padding-bottom:8px;white-space:nowrap;
                transform:translateY(var(--name-dy))}
  /* tagline keeps 20px; it is stretched with kashida (+ a hair of word-spacing) to the ink width of logo + name */
  .tag{margin:12px auto 0;width:max-content;font-family:Plex;font-weight:500;font-size:var(--tag-size);line-height:1.2;
       white-space:nowrap;text-align:center;opacity:.92;word-spacing:var(--tag-ws);transform:translateX(var(--tag-dx))}

  .dest{margin-top:30px;font-family:Naskh;font-weight:700;font-size:118px;line-height:1.05;
        text-shadow:0 2px 24px rgba(0,0,0,.25)}
  .price{margin-top:2px;display:flex;align-items:baseline;gap:14px;color:var(--accent)}
  .price .from{font-family:Plex;font-weight:500;font-size:24px;color:var(--ink);opacity:.9;align-self:center;padding-top:14px}
  .price .num{font-family:Plex;font-weight:600;font-size:96px;line-height:1;direction:ltr;letter-spacing:1px}
  .price .cur{font-family:Plex;font-weight:500;font-size:30px;position:relative;top:-10px}
  .airline{margin-top:10px;font-family:Plex;font-weight:500;font-size:22px;opacity:.92;display:flex;align-items:center;gap:14px;white-space:nowrap}
  .airline::before,.airline::after{content:"";width:46px;height:1px;background:currentColor;opacity:.6}
  .kicker{width:max-content;transform:translateX(var(--kick-dx,0px));margin-top:44px;font-family:Plex;font-weight:500;font-size:30px;line-height:1.2;color:var(--gold);letter-spacing:.5px}
  .kicker + .dest{margin-top:10px}
  /* boarding pass at the bottom */
  .pass{position:absolute;left:56px;right:56px;bottom:108px;height:226px;display:flex;direction:rtl;
        filter:none}
  .pass .main{flex:1;background:rgba(255,255,255,.66);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px);border-radius:0 22px 22px 0;padding:24px 34px 22px;color:var(--green);position:relative;border-left:2.5px dashed #BFD2C4;
     -webkit-mask:radial-gradient(circle at 0 0,transparent 16px,#000 16.5px) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,transparent 16px,#000 16.5px) bottom/100% 51% no-repeat}
  .pass .stubx{width:300px;background:rgba(14,77,44,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px 0 0 22px;padding:24px 28px;color:#FFFFFF;position:relative;
     -webkit-mask:radial-gradient(circle at 100% 0,transparent 16px,#000 16.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,transparent 16px,#000 16.5px) bottom/100% 51% no-repeat}
  .pass .cut{width:0;position:relative;border-right:2.5px dashed #BFD2C4;background:#fff}
  .pass .cut::before,.pass .cut::after{content:"";position:absolute;right:-17px;width:32px;height:32px;border-radius:50%;background:#2a2a35}
  .pass .cut::before{top:-16px} .pass .cut::after{bottom:-16px}
  .row1{display:flex;align-items:center;justify-content:space-between}
  .bplogo{height:58px;display:block}
  .bp{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border-radius:999px;padding:6px 16px 8px;font-family:Plex;font-weight:500;font-size:18px}
  .bp svg{width:17px;height:17px;color:var(--gold)}
  .route{display:flex;align-items:flex-start;gap:16px;direction:ltr}
  .route .code{font-family:Plex;font-weight:600;font-size:38px;letter-spacing:2px;line-height:1}
  .route .city{font-family:Plex;font-size:16px;color:#6E8B77;margin-top:4px;text-align:center;direction:rtl}
  .route svg{margin-top:13px;width:120px;height:14px}
  .fields{margin-top:26px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px}
  .f .k{font-family:Plex;font-size:16px;color:#6E8B77;margin-bottom:4px}
  .f .v .fr{display:block;font-weight:500;font-size:15px;color:#6E8B77;line-height:1.2;margin-bottom:2px}
  .f .v .sub{display:block;font-weight:500;font-size:18px;color:#3E6B4C}
  .f .v{font-family:Plex;font-weight:600;font-size:22px;line-height:1.3;white-space:nowrap}
  .stubx .k{font-family:Plex;font-size:16px;color:#9FC2A6;margin-bottom:10px}
  .stubx ul{list-style:none;font-family:Plex;font-weight:500;font-size:19px;line-height:1.55}
  .stubx li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:10px;vertical-align:middle}
  .glow{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%,#1d6a40 0%,#0E4D2C 55%,#0a3a21 100%)}
  .collage{position:absolute;inset:0;display:block}
  .dest{font-size:92px !important;line-height:1.18 !important;text-align:center}
  .card{position:absolute;left:56px;right:56px;bottom:108px;height:290px;border-radius:24px;
        background:rgba(255,255,255,.72);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px);
        display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:22px 34px;column-gap:28px;direction:rtl}
  .pt{display:flex;align-items:center;gap:16px;color:#0E4D2C}
  .pt .ic{width:58px;height:58px;border-radius:50%;background:#C9A44C;display:flex;align-items:center;justify-content:center;flex:none}
  .pt .ic svg{width:32px;height:32px}
  .pt .tx{font-family:Plex;font-weight:600;font-size:25px;line-height:1.35}
  .perf{margin-top:20px;width:440px;height:2px;
        background-image:radial-gradient(circle,rgba(201,164,76,.85) 1.2px,transparent 1.6px);
        background-size:12px 2px;background-repeat:repeat-x}

  /* ---- footer ---- */
  .foot{position:absolute;left:56px;right:56px;bottom:46px;display:flex;align-items:flex-end;justify-content:space-between}
  .dur .from{font-family:Plex;font-weight:500;font-size:19px;opacity:.85;display:block;margin-bottom:2px}
  .dur .val{font-family:Plex;font-weight:600;font-size:32px;line-height:1.2;white-space:nowrap}
  .stripes{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:7px}
  .stripes i{display:block;width:44px;height:6px;transform:skewX(-35deg);border-radius:1px}
  .stripes i:nth-child(1){background:var(--gold)} .stripes i:nth-child(2){background:var(--mid)}
  .wa{display:flex;align-items:center;gap:10px;direction:ltr;padding-bottom:3px}
  .wa .ph{word-spacing:-3px}
  .wa svg{width:28px;height:28px;flex:none}
  .wa span{font-family:Plex;font-weight:500;font-size:25px;letter-spacing:1px}
</style>
</head>
<body>
<div class="ad">
  <div class="glow"></div>
  <svg class="collage" viewBox="0 0 1080 1350" width="1080" height="1350">
    <defs><clipPath id="off"><polygon points="0,560.0 1080,500.0 1080,1350 0,1350"/></clipPath></defs>
    <image href="../../08-الصور/المكتب - الواجهة (نهائية بإضاءة سينمائية).jpg" x="-860" y="58" width="1940" height="1295" preserveAspectRatio="none" clip-path="url(#off)"/>
    <polygon points="0,542.0 1080,482.0 1080,490.0 0,550.0" fill="#2F7A41"/>
    <polygon points="0,550.0 1080,490.0 1080,496.0 0,556.0" fill="#C9A44C"/>
  </svg>
  <div class="shade-bot"></div>
  <div class="head">
    <div class="brand" id="brand">
      <div class="lockup" id="lockup">
        <img src="../../01-الشعار/أحادي بلا الاسم الصغير/الرمز - أبيض.svg" alt="">
        <div class="name">سماء ديالى</div>
      </div>
      <div class="tag" id="tag">الوكيــــــل العــــــام للخطــــــوط الجويــــــة العراقيـــــة</div>
    </div>
    <div class="kicker">احجز تذكرتك بثقة</div>
    <div class="dest">ليش تحجز من<br>الوكيل العام؟</div>
    <div class="perf"></div>
  </div>
  <div class="card"><div class="pt"><span class="ic"><svg viewBox="0 0 24 24" fill="#0E4D2C"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9zm5-6.5A1.5 1.5 0 1 0 8 8.5 1.5 1.5 0 0 0 8 5.5z"/></svg></span><span class="tx">أسعار العراقية الرسمية</span></div><div class="pt"><span class="ic"><svg viewBox="0 0 24 24" fill="#0E4D2C"><path d="M7 7h11l-3-3 1.4-1.4L21.8 8l-5.4 5.4L15 12l3-3H7V7zm10 10H6l3 3-1.4 1.4L2.2 16l5.4-5.4L9 12l-3 3h11v2z"/></svg></span><span class="tx">تعديل الحجز وتغيير الموعد<br>من عندنا مباشرة</span></div><div class="pt"><span class="ic"><svg viewBox="0 0 24 24" fill="#0E4D2C"><path d="M21.5 15.2v-1.9l-8-5V3.5a1.5 1.5 0 0 0-3 0v4.8l-8 5v1.9l8-2.5v5.3l-2 1.5V21l3.5-1 3.5 1v-1.5l-2-1.5v-5.3z"/></svg></span><span class="tx">تذاكر كل شركات الطيران<br>والفيزا من مكان واحد</span></div><div class="pt"><span class="ic"><svg viewBox="0 0 24 24" fill="#0E4D2C"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 6v2h2V9H7zm4 0v2h2V9h-2zm4 0v2h2V9h-2z"/></svg></span><span class="tx">رد سريع على الواتساب</span></div></div>
  <div class="foot"><div></div>
    <div class="wa">
      <svg viewBox="0 0 32 32" fill="#fff" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.5-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.6.3-.8.3-1.4.2-1.6-.1-.1-.3-.2-.6-.3z"/></svg>
      <span class="ph">077 0006 9900</span>
    </div>
  </div>
  </div>
  <div class="stripes"><i></i><i></i></div>
</div>
<script>document.fonts.ready.then(()=>{document.body.dataset.ready='1'})</script>
</body>
