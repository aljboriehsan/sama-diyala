:root{--green:#0E4D2C;--mid:#2F7A41;--gold:#C9A44C;--dgold:#A8862F;--light:#E9F2EA;

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}

  .lockup .name{font-family:Tajawal;font-weight:700;font-size:62px;line-height:1;padding-bottom:8px;white-space:nowrap;
                transform:translateY(var(--name-dy))}
  .tag{margin:12px auto 0;width:max-content;font-family:TajawalT;font-weight:500;font-size:var(--tag-size);line-height:1.2;

.head{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:5}

.ct .v.ph{word-spacing:-4px;letter-spacing:1px}
.ct .v.em{font-size:29px;font-weight:500}
.ct .sep{width:1.5px;height:70px;background:var(--gold);opacity:.7}
.stripes{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:7px;z-index:5}
.stripes i{display:block;width:44px;height:6px;transform:skewX(-35deg);border-radius:1px}
.stripes i:nth-child(1){background:var(--gold)} .stripes i:nth-child(2){background:var(--mid)}
.greet{font-family:Tajawal;font-weight:700;line-height:1.15}
.ttl{font-family:Tajawal;font-weight:700;line-height:1.15}
.sub{font-family:TajawalT;font-weight:500}

.board{position:absolute;left:56px;right:56px;top:520px;background:#06281a;border-radius:24px;padding:30px 34px 36px;box-shadow:inset 0 0 0 2px rgba(201,164,76,.35),0 24px 50px rgba(0,0,0,.35)}
.bh{display:flex;align-items:center;justify-content:space-between;font-family:TajawalT;font-weight:500;font-size:25px;color:#C9A44C;padding-bottom:16px;border-bottom:1.5px solid rgba(201,164,76,.3)}

.row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:40px 4px;border-bottom:1.5px dashed rgba(233,242,234,.14)}
.row:last-child{border-bottom:0}
.row .k{font-family:TajawalT;font-size:25px;color:#9FC2A6;margin-bottom:6px}
.row .v{font-family:TajawalT;font-weight:600;font-size:41px}
.flaps{display:flex;gap:8px;direction:ltr}
.fl{width:88px;height:122px;border-radius:10px;background:linear-gradient(180deg,#123f28 0 49%,#0b3320 51% 100%);color:#C9A44C;font-family:TajawalT;font-weight:600;font-size:101px;

.st{display:inline-flex;align-items:center;gap:12px;font-family:TajawalT;font-weight:600;font-size:34px;color:#7ee2a0}
