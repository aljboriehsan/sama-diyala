  @font-face{font-family:TajawalT;font-weight:500;src:url("../../07-أدوات/خطوط/tajawal-latin-500-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:TajawalT;font-weight:600;src:url("../../07-أدوات/خطوط/tajawal-arabic-700-normal.woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}

/* Printed billboard, same ratio as the old one (1600×685), rendered ×4. No Samaa Diyala logo (asked by Ihsan). */
:root{--green:#0E4D2C;--mid:#2F7A41;--gold:#C9A44C;--light:#E9F2EA}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:685px;overflow:hidden;background:#0E4D2C}
.ad{position:relative;width:1600px;height:685px;overflow:hidden;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(70% 120% at 85% 30%,#1c6a40 0%,#0E4D2C 55%,#0a3b21 100%)}
/* whole YI-ASU in its real sky, slanted panel on the left */
.ph{position:absolute;left:0;top:0;width:1600px;height:540px;clip-path:polygon(0 0,820px 0,742px 540px,0 540px);
    background:url("../../08-الصور/طائرة العراقية YI-ASU (سماء زرقاء).jpg") -22px -4px/822px auto no-repeat,#688cae}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,77,44,0) 70%,rgba(14,77,44,.25) 100%)}
svg.edge{position:absolute;left:0;top:0}
.txt{position:absolute;right:40px;top:112px;width:740px;display:flex;flex-direction:column;align-items:center;text-align:center}
.bird{height:96px;display:block;margin-bottom:18px}
.t1{font-family:Tajawal;font-weight:700;font-size:68px;line-height:1.1;white-space:nowrap}
.t2{margin-top:16px;font-family:TajawalT;font-weight:600;font-size:44px;color:var(--gold)}
.t2 i{font-style:normal;opacity:.8;padding:0 6px}
.line{margin-top:22px;width:300px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
/* bottom band */
.band{position:absolute;left:0;right:0;bottom:0;height:145px;background:#0a3a20;border-top:4px solid var(--gold);
      display:flex;align-items:center;justify-content:space-between;padding:0 46px;direction:rtl}
.cs{display:flex;align-items:center;gap:18px;background:#fff;color:var(--green);border-radius:20px;padding:10px 26px 12px}
.cs .k{font-family:TajawalT;font-weight:600;font-size:28px;line-height:1.15;text-align:center}
.cs .n{font-family:TajawalT;font-weight:700;font-size:78px;line-height:1;letter-spacing:2px}
.cs .sep{width:2px;height:64px;background:var(--gold)}
.addr{display:flex;align-items:center;gap:16px}
.addr svg{width:46px;height:46px;flex:none}
.addr .a{font-family:TajawalT;font-weight:600;font-size:34px;line-height:1.25}
.addr .b{font-family:TajawalT;font-weight:500;font-size:27px;color:var(--gold)}
.vs{width:2px;height:90px;background:rgba(201,164,76,.6)}
.ph2{display:flex;flex-direction:column;gap:6px}
.ph2 div{display:flex;align-items:center;gap:14px;direction:ltr;font-family:TajawalT;font-weight:700;font-size:44px;letter-spacing:1px;word-spacing:-6px;line-height:1.1}
.ph2 .ic{width:46px;height:46px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.ph2 .ic svg{width:26px;height:26px}
</style></head><body><div class="ad">
<div class="bg"></div>
<div class="ph"></div>
<svg class="edge" width="1600" height="540" viewBox="0 0 1600 540">
  <polygon points="820,0 834,0 756,540 742,540" fill="#C9A44C"/>
  <polygon points="842,0 852,0 774,540 764,540" fill="#2F7A41"/>
</svg>
<div class="txt">
  <img class="bird" src="../../06-مصادر-الشعار/العراقية/طائر العراقية - أبيض.png" alt="">
  <div class="t1">الخطوط الجوية العراقية</div>
  <div class="t2">سافر بثقة <i>…</i> وحلّق أبعد</div>
  <div class="line"></div>
</div>
<div class="band">
  <div class="cs"><div class="k">خدمة<br>الزبائن</div><div class="sep"></div><div class="n">5511</div></div>
  <div class="vs"></div>
  <div class="addr"><svg viewBox="0 0 24 24" fill="#C9A44C"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    <div><div class="a">ديالى – بعقوبة – قرب كراج البحيرة</div><div class="b">الوكالة العامة في المحافظة</div></div></div>
  <div class="vs"></div>
  <div class="ph2">
    <div><span class="ic"><svg viewBox="0 0 32 32" fill="#0E4D2C" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.5-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.6.3-.8.3-1.4.2-1.6-.1-.1-.3-.2-.6-.3z"/></svg></span>077 4177 7500</div>
    <div><span class="ic"><svg viewBox="0 0 24 24" fill="#0E4D2C"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span>077 0756 4440</div>
  </div>
</div>
</div>
