<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>عمولة الإصدار للمكاتب</title>
<style>
@font-face{font-family:Tajawal;font-weight:700;src:url("../../07-أدوات/خطوط/tajawal-arabic-800-normal.woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Tajawal;font-weight:700;src:url("../../07-أدوات/خطوط/tajawal-latin-800-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:TajawalT;font-weight:400;src:url("../../07-أدوات/خطوط/tajawal-arabic-500-normal.woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:TajawalT;font-weight:400;src:url("../../07-أدوات/خطوط/tajawal-latin-500-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:TajawalT;font-weight:500;src:url("../../07-أدوات/خطوط/tajawal-arabic-500-normal.woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:TajawalT;font-weight:500;src:url("../../07-أدوات/خطوط/tajawal-latin-500-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:TajawalT;font-weight:600;src:url("../../07-أدوات/خطوط/tajawal-arabic-700-normal.woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:TajawalT;font-weight:600;src:url("../../07-أدوات/خطوط/tajawal-latin-700-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:TajawalT;font-weight:700;src:url("../../07-أدوات/خطوط/tajawal-arabic-800-normal.woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:TajawalT;font-weight:700;src:url("../../07-أدوات/خطوط/tajawal-latin-800-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:TajawalT;font-weight:800;src:url("../../07-أدوات/خطوط/tajawal-arabic-800-normal.woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:TajawalT;font-weight:800;src:url("../../07-أدوات/خطوط/tajawal-latin-800-normal.woff2");unicode-range:U+0000-00FF,U+2000-206F}


  :root{
    --green:#0E4D2C; --mid:#2F7A41; --gold:#C9A44C; --light:#E9F2EA; --white:#FFFFFF;
    --ink:#FFFFFF;          /* single logo/text colour, chosen per background */
    --accent:var(--gold);   /* price colour */
    --img-y:-150px;
    --lock-dx:-1.9px; --name-dy:4px; --tag-size:23px; --tag-ws:0.72px; --tag-dx:0.4px;   /* header fine-tuning */
    /* --img-y: vertical position of the photo (1080 x 1620 after scaling) */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#0E4D2C}
  .ad{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--ink)}
  .photo{position:absolute;left:0;top:0;width:1080px;height:1004px;background:url("../../08-الصور/وجهات/إسطنبول رأس السنة - كولاج (أجزاء)/sky.jpg") 0 0/1080px 1004px no-repeat}
  .shade-top{position:absolute;inset:0 0 auto 0;height:640px;
             background:linear-gradient(180deg,rgba(6,24,44,.50) 0%,rgba(6,24,44,.38) 60%,rgba(6,24,44,.10) 100%)}
  .collage{position:absolute;inset:0;display:block}
  .shade-bot{position:absolute;inset:auto 0 0 0;height:520px;
             background:linear-gradient(0deg,rgba(4,10,26,.78) 0%,rgba(4,10,26,.35) 55%,rgba(4,10,26,0) 100%)}

  /* ---- header ---- */
  .head{position:absolute;top:58px;left:0;right:0;display:flex;flex-direction:column;align-items:center}
  .brand{display:inline-flex;flex-direction:column;align-items:stretch}
  .lockup{display:flex;align-items:center;justify-content:center;gap:18px}
  .lockup img{height:84px;display:block}
  .lockup{transform:translateX(var(--lock-dx))}
  .lockup .name{font-family:Tajawal;font-weight:700;font-size:62px;line-height:1;padding-bottom:8px;white-space:nowrap;
                transform:translateY(var(--name-dy))}
  /* tagline keeps 20px; it is stretched with kashida (+ a hair of word-spacing) to the ink width of logo + name */
  .tag{margin:12px auto 0;width:max-content;font-family:TajawalT;font-weight:500;font-size:var(--tag-size);line-height:1.2;
       white-space:nowrap;text-align:center;opacity:.92;word-spacing:var(--tag-ws);transform:translateX(var(--tag-dx))}

  .dest{margin-top:30px;font-family:Tajawal;font-weight:700;font-size:136px;line-height:1.05;
        text-shadow:0 2px 24px rgba(0,0,0,.25)}
  .price{margin-top:2px;display:flex;align-items:baseline;gap:14px;color:var(--accent)}
  .price .from{font-family:TajawalT;font-weight:500;font-size:28px;color:var(--ink);opacity:.9;align-self:center;padding-top:14px}
  .price .num{font-family:TajawalT;font-weight:600;font-size:110px;line-height:1;direction:ltr;letter-spacing:1px}
  .price .cur{font-family:TajawalT;font-weight:500;font-size:34px;position:relative;top:-10px}
  .airline{margin-top:10px;font-family:TajawalT;font-weight:500;font-size:25px;opacity:.92;display:flex;align-items:center;gap:14px;white-space:nowrap}
  .airline::before,.airline::after{content:"";width:46px;height:1px;background:currentColor;opacity:.6}
  .kicker{width:max-content;transform:translateX(var(--kick-dx,0px));margin-top:44px;font-family:TajawalT;font-weight:500;font-size:34px;line-height:1.2;color:var(--gold);letter-spacing:.5px}
  .kicker + .dest{margin-top:10px}
  /* boarding pass at the bottom */
  .pass{position:absolute;left:56px;right:56px;bottom:108px;height:226px;display:flex;direction:rtl;
        filter:none}
  .pass .main{flex:1;background:rgba(255,255,255,.66);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px);border-radius:0 22px 22px 0;padding:24px 34px 22px;color:var(--green);position:relative;border-left:2.5px dashed #BFD2C4;
     -webkit-mask:radial-gradient(circle at 0 0,transparent 16px,#000 16.5px) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,transparent 16px,#000 16.5px) bottom/100% 51% no-repeat}
  .pass .stubx{width:300px;background:rgba(14,77,44,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px 0 0 22px;padding:24px 28px;color:#FFFFFF;position:relative;
     -webkit-mask:radial-gradient(circle at 100% 0,transparent 16px,#000 16.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,transparent 16px,#000 16.5px) bottom/100% 51% no-repeat}
  .pass .cut{width:0;position:relative;border-right:2.5px dashed #BFD2C4;background:#fff}
  .pass .cut::before,.pass .cut::after{content:"";position:absolute;right:-17px;width:32px;height:32px;border-radius:50%;background:#2a2a35}
  .pass .cut::before{top:-16px} .pass .cut::after{bottom:-16px}
  .row1{display:flex;align-items:center;justify-content:space-between}
  .bplogo{height:58px;display:block}
  .bp{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border-radius:999px;padding:6px 16px 8px;font-family:TajawalT;font-weight:500;font-size:21px}
  .bp svg{width:17px;height:17px;color:var(--gold)}
  .route{display:flex;align-items:flex-start;gap:16px;direction:ltr}
  .route .code{font-family:TajawalT;font-weight:600;font-size:44px;letter-spacing:2px;line-height:1}
  .route .city{font-family:TajawalT;font-size:18px;color:#6E8B77;margin-top:4px;text-align:center;direction:rtl}
  .route svg{margin-top:13px;width:120px;height:14px}
  .fields{margin-top:26px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px}
  .f .k{font-family:TajawalT;font-size:18px;color:#6E8B77;margin-bottom:4px}
  .f .v .fr{display:block;font-weight:500;font-size:17px;color:#6E8B77;line-height:1.2;margin-bottom:2px}
  .f .v .sub{display:block;font-weight:500;font-size:21px;color:#3E6B4C}
  .f .v{font-family:TajawalT;font-weight:600;font-size:25px;line-height:1.3;white-space:nowrap}
  .stubx .k{font-family:TajawalT;font-size:18px;color:#9FC2A6;margin-bottom:10px}
  .stubx ul{list-style:none;font-family:TajawalT;font-weight:500;font-size:22px;line-height:1.55}
  .stubx li::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:10px;vertical-align:middle}
  .glow{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%,#1d6a40 0%,#0E4D2C 55%,#0a3a21 100%)}
  .collage{position:absolute;inset:0;display:block}
  .dest{font-size:106px !important;line-height:1.18 !important;text-align:center}
  .card{position:absolute;left:56px;right:56px;bottom:108px;height:290px;border-radius:24px;
        background:rgba(255,255,255,.72);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px);
        display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:22px 34px;column-gap:28px;direction:rtl}
  .pt{display:flex;align-items:center;gap:16px;color:#0E4D2C}
  .pt .ic{width:58px;height:58px;border-radius:50%;background:#C9A44C;display:flex;align-items:center;justify-content:center;flex:none}
  .pt .ic svg{width:32px;height:32px}
  .pt .tx{font-family:TajawalT;font-weight:600;font-size:29px;line-height:1.35}
  .sub{margin-top:8px;font-family:TajawalT;font-weight:500;font-size:32px;color:#E9F2EA;opacity:.95}
  .perf{margin-top:20px;width:440px;height:2px;
        background-image:radial-gradient(circle,rgba(201,164,76,.85) 1.2px,transparent 1.6px);
        background-size:12px 2px;background-repeat:repeat-x}


  .head .kicker{margin-top:48px}
  .kicker.greet{font-family:Tajawal;font-weight:700;font-size:57px;line-height:1.15;letter-spacing:0;margin-top:34px}
  .kicker.greet + .ttl{margin-top:2px}
  .comm + .perf{margin-top:34px}
  .ttl{margin-top:8px;font-family:Tajawal;font-weight:700;font-size:97px;line-height:1.15;text-align:center}
  .line{margin-top:6px;font-family:TajawalT;font-weight:500;font-size:34px;color:#E9F2EA;opacity:.95}
  .comm{margin-top:18px;display:flex;align-items:center;gap:22px}
  .comm .w{font-family:Tajawal;font-weight:700;font-size:74px;line-height:1}
  .comm .n{font-family:TajawalT;font-weight:600;font-size:152px;line-height:1;color:var(--gold);direction:ltr;letter-spacing:1px}
  .contact{position:absolute;left:56px;right:56px;bottom:84px;height:184px;border-radius:24px;
        background:rgba(255,255,255,.74);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px);
        display:flex;align-items:center;justify-content:space-around;padding:0 30px;direction:rtl;color:#0E4D2C}
  .contact .it{display:flex;align-items:center;gap:18px}
  .contact .ic{width:66px;height:66px;border-radius:50%;background:#0E4D2C;display:flex;align-items:center;justify-content:center;flex:none}
  .contact .ic svg{width:36px;height:36px}
  .contact .k{font-family:TajawalT;font-weight:500;font-size:23px;color:#3E6B4C;line-height:1.2}
  .contact .v{font-family:TajawalT;font-weight:600;font-size:39px;line-height:1.25;direction:ltr;text-align:right}
  .contact .v.ph{word-spacing:-4px;letter-spacing:1px}
  .contact .v.em{font-size:31px;font-weight:500}
  .contact .sep{width:1px;height:84px;background:#C9A44C;opacity:.8}
  /* ---- footer ---- */
  .foot{position:absolute;left:56px;right:56px;bottom:46px;display:flex;align-items:flex-end;justify-content:space-between}
  .dur .from{font-family:TajawalT;font-weight:500;font-size:22px;opacity:.85;display:block;margin-bottom:2px}
  .dur .val{font-family:TajawalT;font-weight:600;font-size:37px;line-height:1.2;white-space:nowrap}
  .stripes{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:7px}
  .stripes i{display:block;width:44px;height:6px;transform:skewX(-35deg);border-radius:1px}
  .stripes i:nth-child(1){background:var(--gold)} .stripes i:nth-child(2){background:var(--mid)}
  .wa{display:flex;align-items:center;gap:10px;direction:ltr;padding-bottom:3px}
  .wa .ph{word-spacing:-3px}
  .wa svg{width:28px;height:28px;flex:none}
  .wa span{font-family:TajawalT;font-weight:500;font-size:29px;letter-spacing:1px}
.tag{margin-top:10px !important}
.v.ph+.v.ph{margin-top:2px}
</style>
</head>
<body>
<div class="ad">
  <div class="glow"></div>
  <svg class="collage" viewBox="0 0 1080 1350" width="1080" height="1350">
    <defs><clipPath id="off"><polygon points="0,760 1080,700 1080,1350 0,1350"/></clipPath></defs>
    <image href="../../08-الصور/طائرة العراقية (مؤطرة لقالب الثقة).jpg" x="-15" y="610" width="1111" height="850" preserveAspectRatio="none" clip-path="url(#off)"/>
    <polygon points="0,742 1080,682 1080,690 0,750" fill="#2F7A41"/>
    <polygon points="0,750 1080,690 1080,696 0,756" fill="#C9A44C"/>
  </svg>
  <div class="shade-bot"></div>
  <div class="head">
    <div class="brand" id="brand">
      <div class="lockup" id="lockup">
        <img src="../../01-الشعار/أحادي بلا الاسم الصغير/الرمز - أبيض.svg" alt="">
        <div class="name">سماء ديالى</div>
      </div>
      <div class="tag" id="tag">الوكيــــــل العــــــام للخطــــــوط الجويــــــة العراقيـــــة</div>
    </div>
    <div class="kicker greet">صباح الخير</div>
    <div class="ttl">يمكنكم الإصدار الآن</div>
    <div class="line">تذاكر الخطوط الجوية العراقية</div>
    <div class="comm"><span class="w">بعمولة</span><span class="n">6.5%</span></div>
    <div class="perf"></div>
  </div>
  <div class="contact">
    <div class="it"><span class="ic"><svg viewBox="0 0 32 32" fill="#C9A44C" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.5-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.6.3-.8.3-1.4.2-1.6-.1-.1-.3-.2-.6-.3z"/></svg></span><div><div class="k">للإصدار والاستفسار</div><div class="v ph">077 0006 9900</div><div class="v ph">077 0756 4440</div></div></div>
    <div class="sep"></div>
    <div class="it"><span class="ic"><svg viewBox="0 0 24 24" fill="#C9A44C"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2.4V17h16V7.4l-8 5.3-8-5.3zM5.2 7 12 11.5 18.8 7H5.2z"/></svg></span><div><div class="k">البريد الإلكتروني</div><div class="v em">samaa_dyala1@yahoo.com</div></div></div>
  </div>
  <div class="stripes"><i></i><i></i></div>
</div>
<script>
// stretch the agent line to the exact width of logo + name (Tajawal widths differ from the old measured setup)
document.fonts.ready.then(()=>{const t=document.getElementById('tag'),l=document.getElementById('lockup');
 if(t&&l){t.style.transform='none';let ws=0;for(let i=0;i<60;i++){const d=l.getBoundingClientRect().width-t.getBoundingClientRect().width;if(Math.abs(d)<0.5)break;ws+=d/5*0.9;t.style.wordSpacing=ws+'px';}}
 document.body.dataset.ready='1'});
</script>
</body>
</html>
